<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conteo por Estilo — Terex 3</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f4f4f4; }
#search-input { font-size:1rem; border:2px solid #c62828; border-radius:10px; }
#search-input:focus { border-color:#c62828; box-shadow:0 0 0 3px rgba(198,40,40,.15); outline:none; }
#suggestions { position:absolute; z-index:200; background:#fff; border:1px solid #ddd; border-radius:8px; width:100%; max-height:220px; overflow-y:auto; box-shadow:0 4px 12px rgba(0,0,0,.12); display:none; }
.suggestion-item { padding:8px 14px; cursor:pointer; font-size:.88rem; border-bottom:1px solid #f5f5f5; }
.suggestion-item:hover { background:#ffeaea; }
.rank-row { display:flex; align-items:center; padding:9px 14px; border-bottom:1px solid #eee; cursor:pointer; transition:.1s; }
.rank-row:hover { background:#fff5f5; }
.rank-num { font-size:.75rem; color:#aaa; min-width:32px; font-weight:600; }
.rank-modelo { flex:1; font-size:.88rem; font-weight:600; }
.estilo-row { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid #f0f0f0; }
.estilo-nombre { flex:1; font-size:.85rem; color:#333; }
.estilo-input { width:80px; font-size:1rem; font-weight:700; border:2px solid #ddd; border-radius:8px; padding:5px 8px; text-align:center; }
.estilo-input:focus { border-color:#c62828; outline:none; }
.estilo-input.filled { border-color:#2e7d32; background:#f0fff4; }
.panel-header { background:#c62828; color:#fff; padding:11px 16px; font-weight:700; font-size:.9rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
.save-btn { width:100%; background:#c62828; color:#fff; border:none; border-radius:10px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px; }
.save-btn:disabled { background:#aaa; }
#loading { text-align:center; padding:40px; color:#aaa; font-size:.9rem; }
.badge-t2 { background:#c62828; color:#fff; font-size:.68rem; padding:2px 7px; border-radius:8px; }
</style>
</head>
<body>

<div style="max-width:600px; margin:0 auto; padding:16px">

  <!-- Header -->
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="/" style="color:#c62828;font-size:1.3rem;text-decoration:none">&#8592;</a>
    <div>
      <div style="font-size:1.05rem;font-weight:700;line-height:1.1">Conteo por Estilo</div>
      <div style="font-size:.72rem;color:#888">Terex 3 · selecciona modelo → cuenta cada estilo</div>
    </div>
    <span class="badge-t2 ms-auto">T3</span>
  </div>

  <!-- Search -->
  <div class="position-relative mb-3">
    <input id="search-input" type="text" class="form-control py-2 px-3" placeholder="Filtrar modelo..." autocomplete="off">
    <div id="suggestions"></div>
  </div>

  <!-- Estilo count panel (hidden until modelo selected) -->
  <div id="estilo-panel" class="card shadow-sm mb-3" style="display:none; border-radius:10px; overflow:hidden">
    <div class="panel-header">
      <span id="panel-title">—</span>
      <button onclick="closePanel()" style="background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer">✕</button>
    </div>
    <div id="estilo-list"></div>
    <div style="padding:6px 14px 10px;font-size:.75rem;color:#aaa;text-align:center">Presiona OK o Enter para guardar cada estilo</div>
  </div>

  <!-- Ranking list -->
  <div class="card shadow-sm" style="border-radius:10px; overflow:hidden">
    <div style="background:#c62828;color:#fff;padding:8px 14px;font-size:.8rem;font-weight:700">
      MODELOS
    </div>
    <div id="ranking-list">
      <div id="loading">Cargando...</div>
    </div>
  </div>

</div>

<script>
let allRows = [];
let estiloNames = {};
let estiloThumbs = {};
let currentModelo = null;
let currentEstilos = [];
const SESSION_ID = crypto.randomUUID();

async function loadRanking() {
  const [rankRes, namesRes, thumbsRes] = await Promise.all([
    fetch('/api/inventario-rapido-modelo/ranking'),
    fetch('/api/conteo-rapido-estilo/nombres'),
    fetch('/api/conteo-rapido-estilo/thumbs')
  ]);
  allRows = await rankRes.json();
  const namesList = await namesRes.json();
  namesList.forEach(e => { estiloNames[e.id] = e.nombre; });
  estiloThumbs = await thumbsRes.json();
  renderList(allRows);
}

function renderList(rows) {
  const list = document.getElementById('ranking-list');
  if (!rows.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;font-size:.85rem">Sin resultados</div>';
    return;
  }
  list.innerHTML = rows.map(r => `
    <div class="rank-row" onclick="selectModelo('${r.modelo.replace(/'/g,"\\'")}')">
      <span class="rank-num">${r.rank}</span>
      <span class="rank-modelo">${r.modelo}</span>
      <span style="font-size:.7rem;color:#ccc">›</span>
    </div>`).join('');
}

// Search
const input = document.getElementById('search-input');
input.addEventListener('input', () => {
  const q = input.value.trim().toUpperCase();
  if (!q) { renderList(allRows); document.getElementById('suggestions').style.display='none'; return; }
  const filtered = allRows.filter(r => r.modelo.toUpperCase().includes(q));
  renderList(filtered);
  if (filtered.length && q.length > 1) {
    document.getElementById('suggestions').innerHTML = filtered.slice(0,8).map(r =>
      `<div class="suggestion-item" onclick="selectModelo('${r.modelo.replace(/'/g,"\\'")}')"> ${r.modelo}</div>`).join('');
    document.getElementById('suggestions').style.display = '';
  } else {
    document.getElementById('suggestions').style.display = 'none';
  }
});
document.addEventListener('click', e => { if (!e.target.closest('.position-relative')) document.getElementById('suggestions').style.display='none'; });

async function selectModelo(modelo) {
  currentModelo = modelo;
  input.value = '';
  document.getElementById('suggestions').style.display = 'none';
  renderList(allRows);

  document.getElementById('panel-title').textContent = modelo;
  document.getElementById('estilo-list').innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;font-size:.85rem">Cargando estilos...</div>';
  document.getElementById('estilo-panel').style.display = '';

  // scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});

  const r = await fetch('/api/conteo-rapido-estilo/estilos?modelo=' + encodeURIComponent(modelo));
  currentEstilos = await r.json();

  if (!currentEstilos.length) {
    document.getElementById('estilo-list').innerHTML = '<div style="padding:20px;text-align:center;color:#aaa">Sin estilos con stock en T3</div>';
    return;
  }

  document.getElementById('estilo-list').innerHTML = currentEstilos.map((e, i) => `
    <div class="estilo-row" id="row-${e.estilo_id}">
      <span class="rank-num">${i + 1}</span>
      ${estiloThumbs[e.estilo_id] ? `<img src="${estiloThumbs[e.estilo_id]}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0" onerror="this.style.display='none'">` : '<span style="width:36px;flex-shrink:0"></span>'}
      <span class="estilo-nombre">${estiloNames[e.estilo_id] || '—'}</span>
      <input type="number" min="0" inputmode="numeric" class="estilo-input"
        id="ei-${e.estilo_id}" placeholder="—"
        onkeydown="if(event.key==='Enter') saveOne(${e.estilo_id})"
        oninput="this.classList.toggle('filled', this.value !== '')">
      <button onclick="saveOne(${e.estilo_id})"
        style="background:#c62828;color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap"
        id="btn-${e.estilo_id}">OK</button>
    </div>`).join('');

  // auto-focus first input
  const first = document.getElementById('ei-' + currentEstilos[0].estilo_id);
  if (first) first.focus();
}

function closePanel() {
  document.getElementById('estilo-panel').style.display = 'none';
  currentModelo = null;
  currentEstilos = [];
}

async function saveOne(estiloId) {
  const inp = document.getElementById('ei-' + estiloId);
  const qty = parseInt(inp.value);
  if (isNaN(qty) || qty < 0) { inp.focus(); return; }

  const btn = document.getElementById('btn-' + estiloId);
  btn.textContent = '...';
  btn.disabled = true;

  const r = await fetch('/api/conteo-por-estilo', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ sucursal: 'terex3', modelo: currentModelo, session_id: SESSION_ID, rows: [{ estilo_id: estiloId, qty_contada: qty }] })
  });

  if (r.ok) {
    btn.textContent = '✓';
    btn.style.background = '#2e7d32';
    const row = document.getElementById('row-' + estiloId);
    row.style.opacity = '0.5';
    // focus next empty input
    const inputs = document.querySelectorAll('.estilo-input:not([disabled])');
    for (const i of inputs) {
      if (!i.value) { i.focus(); break; }
    }
  } else {
    btn.textContent = 'OK';
    btn.disabled = false;
    alert('Error al guardar');
  }
}

loadRanking();
</script>
</body>
</html>
