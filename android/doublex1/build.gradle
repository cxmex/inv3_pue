plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fundastock.doublex1'
    compileSdk 34

    defaultConfig {
        applicationId "com.fundastock.doublex1"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'

    // Networking (list the storage bucket)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Image loading + caching for the slideshow
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
