plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fundastock.doublex1'
    compileSdk 34

    defaultConfig {
        applicationId "com.fundastock.doublex1"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Without okhttp pinning a consistent kotlin-stdlib version, Glide's
// transitive deps resolve kotlin-stdlib-jdk7/jdk8 at a different version
// than kotlin-stdlib itself, which duplicates classes merged into
// kotlin-stdlib since 1.8. Force one version everywhere to resolve it.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'

    // Image loading for the slideshow (loads from assets/photos/)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
